<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snake 🐍</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: -apple-system, system-ui, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            color: white;
            overflow: hidden;
            padding: 10px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 400px;
            padding: 10px;
            background: rgba(0,0,0,0.4);
            border-radius: 12px;
            margin-bottom: 10px;
        }

        .score-box {
            text-align: center;
        }

        .score-label {
            font-size: 12px;
            opacity: 0.8;
        }

        .score-value {
            font-size: 24px;
            font-weight: bold;
            color: #4CAF50;
        }

        #gameCanvas {
            border: 3px solid #4CAF50;
            border-radius: 10px;
            background: #1a1a1a;
            box-shadow: 0 10px 40px rgba(0,0,0,0.6);
            max-width: 400px;
            width: 100%;
        }

        .game-over-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            display: none;
            z-index: 100;
            border: 3px solid #f44336;
        }

        .game-over-screen h2 {
            font-size: 36px;
            margin-bottom: 20px;
            color: #f44336;
        }

        .start-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.8);
            padding: 20px 30px;
            border-radius: 15px;
            text-align: center;
            font-size: 18px;
            pointer-events: none;
        }

        .restart-btn {
            padding: 15px 35px;
            background: #4CAF50;
            border: none;
            border-radius: 12px;
            color: white;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">HIGH SCORE</div>
            <div class="score-value" id="highScore">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">SPEED</div>
            <div class="score-value" id="speed">1</div>
        </div>
    </div>

    <canvas id="gameCanvas" width="400" height="500"></canvas>

    <div class="start-message" id="startMessage">Swipe to Start! 👆</div>

    <div class="game-over-screen" id="gameOver">
        <h2>GAME OVER</h2>
        <div style="font-size: 24px; margin: 15px 0;">Score: <span id="finalScore">0</span></div>
        <div style="font-size: 18px; opacity: 0.8;">High Score: <span id="finalHighScore">0</span></div>
        <button class="restart-btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const GRID = 25, COLS = 16, ROWS = 20;

        let snake = [{x: 10, y: 10}];
        let food = {x: 15, y: 15};
        let dx = 0, dy = 0;
        let score = 0, highScore = localStorage.getItem('snakeHighScore') || 0;
        let speed = 1, gameSpeed = 200;
        let gameRunning = true, lastTime = 0;

        document.getElementById('highScore').textContent = highScore;

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };
            // Avoid spawning on snake
            if (snake.some(s => s.x === food.x && s.y === food.y)) {
                randomFood();
            }
        }

        function draw() {
            // Background
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Grid
            ctx.strokeStyle = '#2a2a2a';
            ctx.lineWidth = 1;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID, 0);
                ctx.lineTo(i * GRID, canvas.height);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID);
                ctx.lineTo(canvas.width, i * GRID);
                ctx.stroke();
            }

            // Snake
            snake.forEach((segment, index) => {
                if (index === 0) {
                    // Head
                    ctx.fillStyle = '#2E7D32';
                    ctx.beginPath();
                    ctx.arc(segment.x * GRID + GRID/2, segment.y * GRID + GRID/2, GRID/2 - 1, 0, Math.PI * 2);
                    ctx.fill();
                    // Eyes
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(segment.x * GRID + GRID/2 - 4, segment.y * GRID + GRID/2 - 3, 2, 0, Math.PI * 2);
                    ctx.arc(segment.x * GRID + GRID/2 + 4, segment.y * GRID + GRID/2 - 3, 2, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    // Body
                    ctx.fillStyle = index % 2 === 0 ? '#4CAF50' : '#66BB6A';
                    ctx.beginPath();
                    ctx.arc(segment.x * GRID + GRID/2, segment.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            // Food
            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
            ctx.fill();

            // M.A. Signature
            ctx.save();
            ctx.fillStyle = '#333';
            ctx.font = '600 16px "Bodoni Moda", serif';
            ctx.textAlign = 'right';
            ctx.fillText('M.A.', canvas.width - 10, canvas.height - 10);
            ctx.restore();
        }

        function update() {
            if (!gameRunning || (dx === 0 && dy === 0)) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // Wall collision
            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                gameOver();
                return;
            }

            // Self collision
            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            // Food collision
            if (head.x === food.x && head.y === food.y) {
                score += 10;
                speed = Math.floor(score / 50) + 1;
                gameSpeed = Math.max(80, 180 - (speed - 1) * 10);
                document.getElementById('score').textContent = score;
                document.getElementById('speed').textContent = speed;
                randomFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalHighScore').textContent = highScore;
            document.getElementById('gameOver').style.display = 'block';
        }

        function gameLoop(time = 0) {
            if (!gameRunning) return;

            if (time - lastTime > gameSpeed) {
                update();
                draw();
                lastTime = time;
            }

            requestAnimationFrame(gameLoop);
        }

        function changeDirection(newDx, newDy) {
            // Prevent reversing
            if ((dx === 1 && newDx === -1) || (dx === -1 && newDx === 1)) return;
            if ((dy === 1 && newDy === -1) || (dy === -1 && newDy === 1)) return;
            dx = newDx;
            dy = newDy;
        }

        // Keyboard controls
        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            if (e.key === 'ArrowUp') changeDirection(0, -1);
            if (e.key === 'ArrowDown') changeDirection(0, 1);
            if (e.key === 'ArrowLeft') changeDirection(-1, 0);
            if (e.key === 'ArrowRight') changeDirection(1, 0);
        });

        // Swipe controls on canvas
        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        });

        canvas.addEventListener('touchend', e => {
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            // Hide start message on first swipe
            document.getElementById('startMessage').style.display = 'none';

            if (Math.abs(dx) > Math.abs(dy)) {
                if (dx > 30) changeDirection(1, 0);
                else if (dx < -30) changeDirection(-1, 0);
            } else {
                if (dy > 30) changeDirection(0, 1);
                else if (dy < -30) changeDirection(0, -1);
            }
        });

        draw();
        gameLoop();
    </script>
</body>
</html>
