<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Snake 🐍</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Bodoni+Moda:wght@600&display=swap');

        * { 
            margin: 0; 
            padding: 0; 
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
            background: linear-gradient(135deg, #0f2027 0%, #203a43 50%, #2c5364 100%);
            background-attachment: fixed;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            min-height: 100dvh;
            width: 100vw;
            color: white;
            overflow: hidden;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            padding: env(safe-area-inset-top, 8px) env(safe-area-inset-right, 8px) env(safe-area-inset-bottom, 8px) env(safe-area-inset-left, 8px);
        }

        .header {
            display: flex;
            justify-content: space-around;
            width: 100%;
            max-width: min(95vw, 420px);
            padding: clamp(8px, 2vw, 12px);
            background: rgba(0,0,0,0.5);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            margin-bottom: clamp(8px, 2vh, 12px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .score-box {
            text-align: center;
            flex: 1;
        }

        .score-label {
            font-size: clamp(10px, 2.5vw, 12px);
            opacity: 0.8;
            letter-spacing: 0.5px;
            font-weight: 500;
        }

        .score-value {
            font-size: clamp(20px, 5vw, 26px);
            font-weight: 700;
            color: #4CAF50;
            text-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
        }

        #gameCanvas {
            border: 3px solid #4CAF50;
            border-radius: 16px;
            background: #1a1a1a;
            box-shadow: 0 8px 32px rgba(0,0,0,0.6), 0 0 0 1px rgba(76, 175, 80, 0.2);
            max-width: min(95vw, 420px);
            width: 100%;
            height: auto;
            aspect-ratio: 1;
            touch-action: none;
        }

        .game-over-screen {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.96);
            backdrop-filter: blur(20px);
            padding: clamp(30px, 8vw, 50px);
            border-radius: 24px;
            text-align: center;
            display: none;
            z-index: 100;
            border: 3px solid #f44336;
            box-shadow: 0 20px 60px rgba(0,0,0,0.8);
            max-width: 90vw;
        }

        .game-over-screen h2 {
            font-size: clamp(28px, 8vw, 40px);
            margin-bottom: clamp(15px, 4vw, 25px);
            color: #f44336;
            text-shadow: 0 2px 12px rgba(244, 67, 54, 0.5);
        }

        .start-message {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(10px);
            padding: clamp(16px, 4vw, 24px) clamp(24px, 6vw, 36px);
            border-radius: 20px;
            text-align: center;
            font-size: clamp(16px, 4vw, 20px);
            pointer-events: none;
            animation: pulse 2s ease-in-out infinite;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
            50% { opacity: 0.8; transform: translate(-50%, -50%) scale(1.05); }
        }

        .restart-btn {
            padding: clamp(12px, 3vw, 16px) clamp(28px, 7vw, 40px);
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            border: none;
            border-radius: 16px;
            color: white;
            font-size: clamp(16px, 4vw, 20px);
            font-weight: 700;
            cursor: pointer;
            margin-top: clamp(16px, 4vw, 24px);
            box-shadow: 0 4px 16px rgba(76, 175, 80, 0.4);
            transition: all 0.2s ease;
            min-height: 48px;
            touch-action: manipulation;
        }

        .restart-btn:active {
            transform: scale(0.96);
            box-shadow: 0 2px 8px rgba(76, 175, 80, 0.4);
        }

        @media (hover: hover) {
            .restart-btn:hover {
                background: linear-gradient(135deg, #45a049 0%, #4CAF50 100%);
                box-shadow: 0 6px 20px rgba(76, 175, 80, 0.5);
            }
        }

        .fullscreen-btn {
            position: fixed;
            top: env(safe-area-inset-top, 12px);
            right: env(safe-area-inset-right, 12px);
            width: 44px;
            height: 44px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(10px);
            border: 2px solid rgba(76, 175, 80, 0.5);
            border-radius: 12px;
            color: #4CAF50;
            font-size: 20px;
            cursor: pointer;
            z-index: 1000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            touch-action: manipulation;
        }

        .fullscreen-btn:active {
            background: rgba(0,0,0,0.8);
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <button class="fullscreen-btn" id="fullscreenBtn" title="Toggle Fullscreen">⛶</button>

    <div class="header">
        <div class="score-box">
            <div class="score-label">SCORE</div>
            <div class="score-value" id="score">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">HIGH SCORE</div>
            <div class="score-value" id="highScore">0</div>
        </div>
        <div class="score-box">
            <div class="score-label">SPEED</div>
            <div class="score-value" id="speed">1</div>
        </div>
    </div>

    <canvas id="gameCanvas" width="384" height="384"></canvas>

    <div class="start-message" id="startMessage">Swipe to Start! 👆</div>

    <div class="game-over-screen" id="gameOver">
        <h2>GAME OVER</h2>
        <div style="font-size: 24px; margin: 15px 0;">Score: <span id="finalScore">0</span></div>
        <div style="font-size: 18px; opacity: 0.8;">High Score: <span id="finalHighScore">0</span></div>
        <button class="restart-btn" onclick="location.reload()">PLAY AGAIN</button>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d', { alpha: false });
        const GRID = 32, COLS = 12, ROWS = 12;
        
        // Optimize canvas for mobile
        const dpr = window.devicePixelRatio || 1;
        canvas.style.width = canvas.width + 'px';
        canvas.style.height = canvas.height + 'px';
        canvas.width = canvas.width * dpr;
        canvas.height = canvas.height * dpr;
        ctx.scale(dpr, dpr);
        const CANVAS_SIZE = 384;

        let snake = [{x: 6, y: 6}];
        let food = {x: 9, y: 9};
        let dx = 0, dy = 0;
        let score = 0, highScore = localStorage.getItem('snakeHighScore') || 0;
        let speed = 1, gameSpeed = 220;
        let gameRunning = true, lastTime = 0;

        document.getElementById('highScore').textContent = highScore;

        // Sound effects
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        function playEatSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 800;
            gain.gain.value = 0.1;
            osc.start();
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.stop(audioCtx.currentTime + 0.1);
        }
        
        function playGameOverSound() {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.frequency.value = 400;
            gain.gain.value = 0.15;
            osc.start();
            osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.3);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.stop(audioCtx.currentTime + 0.3);
        }

        function randomFood() {
            food = {
                x: Math.floor(Math.random() * COLS),
                y: Math.floor(Math.random() * ROWS)
            };
            if (snake.some(s => s.x === food.x && s.y === food.y)) {
                randomFood();
            }
        }

        function draw() {
            ctx.fillStyle = '#1a1a1a';
            ctx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);

            ctx.strokeStyle = '#252525';
            ctx.lineWidth = 0.5;
            for (let i = 0; i <= COLS; i++) {
                ctx.beginPath();
                ctx.moveTo(i * GRID, 0);
                ctx.lineTo(i * GRID, CANVAS_SIZE);
                ctx.stroke();
            }
            for (let i = 0; i <= ROWS; i++) {
                ctx.beginPath();
                ctx.moveTo(0, i * GRID);
                ctx.lineTo(CANVAS_SIZE, i * GRID);
                ctx.stroke();
            }

            snake.forEach((segment, index) => {
                if (index === 0) {
                    const gradient = ctx.createRadialGradient(
                        segment.x * GRID + GRID/2, segment.y * GRID + GRID/2, 0,
                        segment.x * GRID + GRID/2, segment.y * GRID + GRID/2, GRID/2
                    );
                    gradient.addColorStop(0, '#43A047');
                    gradient.addColorStop(1, '#2E7D32');
                    ctx.fillStyle = gradient;
                    ctx.beginPath();
                    ctx.arc(segment.x * GRID + GRID/2, segment.y * GRID + GRID/2, GRID/2 - 2, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#fff';
                    ctx.beginPath();
                    ctx.arc(segment.x * GRID + GRID/2 - 5, segment.y * GRID + GRID/2 - 4, 3, 0, Math.PI * 2);
                    ctx.arc(segment.x * GRID + GRID/2 + 5, segment.y * GRID + GRID/2 - 4, 3, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.fillStyle = '#000';
                    ctx.beginPath();
                    ctx.arc(segment.x * GRID + GRID/2 - 5, segment.y * GRID + GRID/2 - 4, 1.5, 0, Math.PI * 2);
                    ctx.arc(segment.x * GRID + GRID/2 + 5, segment.y * GRID + GRID/2 - 4, 1.5, 0, Math.PI * 2);
                    ctx.fill();
                } else {
                    ctx.fillStyle = index % 2 === 0 ? '#4CAF50' : '#66BB6A';
                    ctx.beginPath();
                    ctx.arc(segment.x * GRID + GRID/2, segment.y * GRID + GRID/2, GRID/2 - 3, 0, Math.PI * 2);
                    ctx.fill();
                }
            });

            ctx.shadowBlur = 15;
            ctx.shadowColor = '#FF5252';
            ctx.fillStyle = '#FF5252';
            ctx.beginPath();
            ctx.arc(food.x * GRID + GRID/2, food.y * GRID + GRID/2, GRID/2 - 3, 0, Math.PI * 2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // M.A. Signature - Subtle but visible
            ctx.save();
            ctx.fillStyle = '#444';
            ctx.font = '600 17px "Bodoni Moda", serif';
            ctx.textAlign = 'right';
            ctx.fillText('M.A.', CANVAS_SIZE - 12, CANVAS_SIZE - 12);
            ctx.restore();
        }

        function update() {
            if (!gameRunning || (dx === 0 && dy === 0)) return;

            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            if (head.x < 0 || head.x >= COLS || head.y < 0 || head.y >= ROWS) {
                gameOver();
                return;
            }

            if (snake.some(s => s.x === head.x && s.y === head.y)) {
                gameOver();
                return;
            }

            snake.unshift(head);

            if (head.x === food.x && head.y === food.y) {
                playEatSound();
                score += 10;
                speed = Math.floor(score / 50) + 1;
                gameSpeed = Math.max(90, 220 - (speed - 1) * 13);
                document.getElementById('score').textContent = score;
                document.getElementById('speed').textContent = speed;
                randomFood();
            } else {
                snake.pop();
            }
        }

        function gameOver() {
            gameRunning = false;
            playGameOverSound();
            if (score > highScore) {
                highScore = score;
                localStorage.setItem('snakeHighScore', highScore);
            }
            document.getElementById('finalScore').textContent = score;
            document.getElementById('finalHighScore').textContent = highScore;
            document.getElementById('gameOver').style.display = 'block';
        }

        function gameLoop(time = 0) {
            if (!gameRunning) return;
            if (time - lastTime > gameSpeed) {
                update();
                draw();
                lastTime = time;
            }
            requestAnimationFrame(gameLoop);
        }

        function changeDirection(newDx, newDy) {
            if ((dx === 1 && newDx === -1) || (dx === -1 && newDx === 1)) return;
            if ((dy === 1 && newDy === -1) || (dy === -1 && newDy === 1)) return;
            dx = newDx;
            dy = newDy;
        }

        document.addEventListener('keydown', e => {
            if (!gameRunning) return;
            if (e.key === 'ArrowUp') changeDirection(0, -1);
            if (e.key === 'ArrowDown') changeDirection(0, 1);
            if (e.key === 'ArrowLeft') changeDirection(-1, 0);
            if (e.key === 'ArrowRight') changeDirection(1, 0);
        });

        let touchStartX = 0, touchStartY = 0;
        canvas.addEventListener('touchstart', e => {
            e.preventDefault();
            touchStartX = e.touches[0].clientX;
            touchStartY = e.touches[0].clientY;
        }, { passive: false });

        canvas.addEventListener('touchmove', e => {
            e.preventDefault();
        }, { passive: false });

        canvas.addEventListener('touchend', e => {
            e.preventDefault();
            const touchEndX = e.changedTouches[0].clientX;
            const touchEndY = e.changedTouches[0].clientY;
            const dx = touchEndX - touchStartX;
            const dy = touchEndY - touchStartY;

            document.getElementById('startMessage').style.display = 'none';

            const minSwipe = 20;
            if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > minSwipe) {
                changeDirection(dx > 0 ? 1 : -1, 0);
            } else if (Math.abs(dy) > minSwipe) {
                changeDirection(0, dy > 0 ? 1 : -1);
            }
        }, { passive: false });

        // Fullscreen button
        const fullscreenBtn = document.getElementById('fullscreenBtn');
        fullscreenBtn.addEventListener('click', () => {
            if (!document.fullscreenElement && !document.webkitFullscreenElement) {
                if (document.documentElement.requestFullscreen) {
                    document.documentElement.requestFullscreen();
                } else if (document.documentElement.webkitRequestFullscreen) {
                    document.documentElement.webkitRequestFullscreen();
                }
                fullscreenBtn.textContent = '⛶';
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
                fullscreenBtn.textContent = '⛶';
            }
        });

        // Prevent zoom on double tap
        let lastTouchEnd = 0;
        document.addEventListener('touchend', e => {
            const now = Date.now();
            if (now - lastTouchEnd <= 300) {
                e.preventDefault();
            }
            lastTouchEnd = now;
        }, false);

        // Fullscreen on mobile - hide address bar
        function enterFullscreen() {
            if (document.documentElement.requestFullscreen) {
                document.documentElement.requestFullscreen().catch(() => {});
            } else if (document.documentElement.webkitRequestFullscreen) {
                document.documentElement.webkitRequestFullscreen().catch(() => {});
            }
            // Scroll to hide address bar on iOS
            window.scrollTo(0, 1);
            setTimeout(() => window.scrollTo(0, 0), 100);
        }

        // Auto-enter fullscreen on first interaction
        let hasInteracted = false;
        document.addEventListener('touchstart', () => {
            if (!hasInteracted) {
                hasInteracted = true;
                enterFullscreen();
            }
        }, { once: true });

        // Handle orientation change
        window.addEventListener('orientationchange', () => {
            setTimeout(() => {
                window.scrollTo(0, 1);
                setTimeout(() => window.scrollTo(0, 0), 100);
            }, 100);
        });

        // Prevent pull-to-refresh
        document.body.addEventListener('touchmove', e => {
            if (e.touches.length > 1) return;
            e.preventDefault();
        }, { passive: false });

        draw();
        gameLoop();
    </script>
</body>
</html>
